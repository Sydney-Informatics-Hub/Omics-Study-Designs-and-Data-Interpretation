site_name: Foundations of Omics
repo_url: https://github.com/Sydney-Informatics-Hub/Omics-Study-Designs-and-Data-Interpretation
repo_name: Sydney-Informatics-Hub/Omics-Study-Designs-and-Data-Interpretation

nav:
  # Landing page
  - Home: index.md
  - Introduction: Introduction.md
  - Module 1: 
    - Module 1.1 landscape: module1-1.md
    - Module 1.2 Workflow: module1-2-0.md
    - Stage A · Design: module1-2-1.md
    - Stage B · Data acquisition: module1-2-2.md
    - Stage C · Preprocessing: module1-2-3.md
    - Stage D · Analysis: module1-2-4.md
    - Stage E · Reporting: module1-2-5.md
    - Activity: module1-2-6.md

  - Module 2:
    - Introduction: module-nm2.0.md
    - Choosing platforms: module-nm2.1.md
    - Confounding & batch effects: module-nm2.2.md
    - Replication: module-nm2.3.md
    - Sample Size: module-nm2.4.md
    - MetaData Guide: module-nm2.5.md
  - References: further-reading.md
  
  # Example top-level page
  #- Setup: setup.md
  # Example nested page
  # - Part 1:
  #   - Introduction: part1/intro.md

theme:
  name: material
  logo: assets/usyd-logo.png
  features:
    - navigation.footer
    - content.code.copy
    - navigation.tabs          # by Amarinder Thind
    - navigation.tabs.sticky   # by Amarinder Thind
  palette:
    - scheme: default
      primary: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      preserve_tabs: true
  - attr_list
  - md_in_html
  - pymdownx.superfences

extra:
  analytics:
    provider: google
    property: G-TNWWV3HK57

copyright: >
