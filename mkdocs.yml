site_name: Foundations of Omics
repo_url: https://github.com/Sydney-Informatics-Hub/Omics-Study-Designs-and-Data-Interpretation
repo_name: Sydney-Informatics-Hub/Omics-Study-Designs-and-Data-Interpretation

nav:
  # Landing page
  - Home: index.md
  - Module 1: 
    - Module 1.1 Omics landscape: module1-1.md
    - Module 1.2 Experimental workflow: 
      - 1.2.0 Overview: module1-2-0.md
      - 1.2.1 - Design: module1-2-1.md
      - 1.2.2 - Data acquisition: module1-2-2.md
      - 1.2.3 - Preprocessing: module1-2-3.md
      - 1.2.4 - Analysis: module1-2-4.md
      - 1.2.5 - Reporting: module1-2-5.md
      - 1.2.6 - Activity: module1-2-6.md
  - Module 2: 
      - Overview: module2-0.md
      - Module 2.1 Accuracy and interpretability:
          - 2.1.1 Choosing a platform: module2-1-1.md
          - 2.1.2 Confounding and batch: module2-1-2.md
          - 2.1.3 Measurement and metadata: module2-1-3.md
      - Module 2.2 Power and cost:
          - 2.2.1 Sample size: module2-2-1.md
          - 2.2.2 Spending the budget: module2-2-2.md
      - Module 2.3 Generalisability:
          - 2.3.1 Who the findings apply to: module2-3-1.md
      - 2.4 Putting it together: module2-4.md

  - References: further-reading.md

theme:
  name: material
  logo: assets/usyd-logo.png
  features:
    - navigation.footer
    - content.code.copy
    - navigation.tabs          
    - navigation.tabs.sticky   
  palette:
    - scheme: default
      primary: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      preserve_tabs: true
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - toc:
      toc_depth: 2

extra:
  analytics:
    provider: google
    property: G-TNWWV3HK57

